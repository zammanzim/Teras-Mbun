<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teras Mbun — Pesen Enak, Tanpa Ribet</title>
  <meta name="description" content="Pesen makanan Teras Mbun lewat web. Pilih menu, kirim pesenan, tinggal nunggu siap.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a1810">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="logo"><i class="fa-solid fa-bowl-food"></i></span>
        <span class="nama">Teras Mbun</span>
      </a>
      <div class="top-right">
        <div class="dropdown" id="navDropdown">
          <button class="btn btn-kecil btn-kaca btn-titik" id="btnNavMenu"
                  aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="navPanel">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          <nav class="dropdown-panel" id="navPanel" hidden>
            <!-- link section di-render dari NAV_SECTIONS di js/menu.js -->
          </nav>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== GREETING: full satu layar, di atas ===== -->
  <section class="greeting" id="greeting">
    <div class="greet-inner">
      <span class="greet-emoji">🍜</span>
      <p class="greet-halo">Selamat datang di</p>
      <h1 class="greet-judul">Teras <em>Mbun</em></h1>
      <p class="greet-sub">Pesen enak tanpa ribet. Pilih menu, kirim, tunggu siap — gak usah antri di WA.</p>
      <div class="greet-aksi">
        <button class="btn btn-besar" id="btnPesanSekarang">Pesan Sekarang <i class="fa-solid fa-arrow-down"></i></button>
        <button class="btn btn-kaca" id="btnLihatStatus">Cek Status</button>
      </div>
      <span class="greet-scroll"><i class="fa-solid fa-chevron-down"></i> scroll buat liat menu</span>
    </div>
  </section>

  <main class="wrap">
    <!-- ===== SECTION 1: showcase menu (kartu + foto + deskripsi) ===== -->
    <section class="seksi" id="daftar">
      <div class="menu-tampil" id="menuTampil">
        <p class="kosong"><i class="fa-solid fa-spinner fa-spin"></i> Muat menu…</p>
      </div>
    </section>

    <!-- ===== SECTION 2: pesenan (daftar polos + tombol +/−) ===== -->
    <section class="seksi" id="menu">
      <div class="grid" id="gridMenu">
        <p class="kosong"><i class="fa-solid fa-spinner fa-spin"></i> Muat menu…</p>
      </div>
    </section>

    <!-- ===== Cek status ===== -->
    <section class="cek-status" id="cekStatus">
      <h2><i class="fa-solid fa-magnifying-glass"></i> Cek status pesenan</h2>
      <div class="row-input">
        <input type="text" id="inputKode" placeholder="Kode pesenan, mis. 001" autocomplete="off">
        <button class="btn btn-hijau" id="btnCek">Cek</button>
      </div>
      <div class="hasil-status" id="hasilStatus"></div>
    </section>
  </main>

  <div class="bar-bawah" id="barBawah" hidden>
    <div class="inner">
      <div class="total">
        <small id="barJml">0 item</small>
        <b id="barTotal">Rp0</b>
      </div>
      <button class="btn btn-hijau" id="btnPesan">Kirim Pesenan <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/notice.js"></script>
  <script src="js/show-popup.js"></script>
  <script src="js/db.js"></script>
  <script src="js/menu.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
