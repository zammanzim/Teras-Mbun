<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dapur — Teras Mbun</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a1810">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Gerbang PIN -->
  <div class="gate" id="gate">
    <div class="box">
      <div class="ikon"><i class="fa-solid fa-kitchen-set"></i></div>
      <h1>Dapur Teras Mbun</h1>
      <p>Masukin PIN biar bisa lihat & ceklis pesenan.</p>
      <input type="password" id="inputPin" placeholder="PIN dapur" inputmode="numeric" autocomplete="off">
      <button class="btn btn-hijau btn-lebar" id="btnMasuk" style="margin-top:12px">Masuk</button>
    </div>
  </div>

  <!-- Isi dapur -->
  <div id="isi" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="dapur.html">
          <span class="logo"><i class="fa-solid fa-kitchen-set"></i></span>
          <span class="nama">Dapur Mbun<small id="subJudul">PESANAN HARI INI</small></span>
        </a>
        <div class="top-right">
          <a class="btn btn-kecil btn-kaca" href="admin.html" title="Kelola menu & foto"><i class="fa-solid fa-camera"></i></a>
          <button class="btn btn-kecil btn-kaca" id="btnHariIni" title="Filter hari ini"><i class="fa-solid fa-calendar-day"></i></button>
          <button class="btn btn-kecil btn-kaca" id="btnSegarkan" title="Segarkan"><i class="fa-solid fa-rotate"></i></button>
          <button class="btn btn-kecil btn-kaca" id="btnKeluar" title="Keluar"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="tabs" id="tabs">
        <button class="tab aktif" data-tab="menunggu">Baru Masuk<span class="jml" id="jmlMenunggu">0</span></button>
        <button class="tab" data-tab="dibuat">Lagi Dibuat<span class="jml" id="jmlDibuat">0</span></button>
        <button class="tab" data-tab="siap">Siap<span class="jml" id="jmlSiap">0</span></button>
      </div>

      <button class="btn btn-hijau btn-lebar" id="btnShareWa" style="margin-bottom:14px">
        <i class="fa-brands fa-whatsapp"></i> Kirim ringkasan pesenan ke WhatsApp
      </button>

      <div id="daftar">
        <p class="kosong"><i class="fa-solid fa-spinner fa-spin"></i> Muat pesenan…</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/notice.js"></script>
  <script src="js/show-popup.js"></script>
  <script src="js/db.js"></script>
  <script src="js/dapur.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
